<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Recorder Chrome AppAlbania</title>
<link rel="icon" href="../icons/icon32.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="../icons/icon48.png" alt=""><div>Recorder &amp; Screenshot<small>Chrome AppAlbania</small></div></div>
    <nav>
      <a href="library.html" data-icon="film"><span data-t="gallery"></span></a>
      <a href="options.html" class="on" data-icon="gear"><span data-t="settings"></span></a>
    </nav>
  </div>

  <div class="wrap narrow">
    <h1 data-t="setTitle"></h1>

    <section class="card">
      <h2 data-t="folder"></h2>
      <p class="muted" data-t="folderHint"></p>
      <div class="folder-row" id="folderRow" title="">
        <span class="folder-ico" data-icon="folder"></span>
        <div class="grow"><b id="folderName"></b><small class="muted" id="folderNote"></small></div>
        <button class="btn primary" id="choose" data-icon="folder"><span id="chooseText"></span></button>
      </div>
      <div class="row-btns">
        <button class="btn" id="grant" data-icon="lock"><span data-t="grant"></span></button>
        <button class="btn ghost" id="useDownloads"><span data-t="useDownloads"></span></button>
      </div>
    </section>

    <section class="card">
      <h2 data-t="video"></h2>
      <div class="field"><label data-t="quality"></label>
        <div class="seg" data-key="quality">
          <button data-v="720">720p</button><button data-v="1080">Full HD 1080p</button><button data-v="2160">4K</button>
        </div>
      </div>
      <div class="field"><label data-t="fps"></label>
        <div class="seg" data-key="fps"><button data-v="30">30 fps</button><button data-v="60">60 fps</button></div>
      </div>
      <div class="field"><label data-t="format"></label>
        <div class="seg" data-key="format"><button data-v="mp4">MP4</button><button data-v="webm">WebM</button></div>
      </div>
      <p class="muted small hidden" id="fmtNote" data-t="notSupported"></p>
    </section>

    <section class="card">
      <h2 data-t="audio"></h2>
      <div class="field">
        <div><label for="tabAudio" data-t="tabAudio"></label><small class="muted block" data-t="tabAudioHint"></small></div>
        <span class="switch"><input type="checkbox" id="tabAudio" data-key="tabAudio"><span></span></span>
      </div>
      <div class="field">
        <div><label for="micSel" data-t="mic"></label><small class="muted block" data-t="micHint"></small></div>
        <select id="micSel" class="select"></select>
      </div>
      <div class="field hidden" id="micRow">
        <span class="muted" id="micState"></span>
        <button class="btn" id="micAllow" data-icon="mic"><span data-t="micAllow"></span></button>
      </div>
    </section>

    <section class="card">
      <h2 data-t="extras"></h2>
      <div class="field"><label for="countdown" data-t="countdownOpt"></label><span class="switch"><input type="checkbox" id="countdown" data-key="countdown"><span></span></span></div>
      <div class="field"><label for="openLibrary" data-t="openLib"></label><span class="switch"><input type="checkbox" id="openLibrary" data-key="openLibrary"><span></span></span></div>
      <div class="field"><label data-t="shortcut"></label>
        <span class="row-btns tight"><span class="kbd" id="kbd">—</span><button class="btn ghost" id="shortcutBtn" data-t="changeShortcut"></button></span>
      </div>
      <div class="field"><label data-t="language"></label>
        <div class="seg" data-key="lang"><button data-v="auto" data-t="auto"></button><button data-v="sq">Shqip</button><button data-v="en">English</button></div>
      </div>
    </section>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
