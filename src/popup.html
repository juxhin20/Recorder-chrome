<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Recorder Chrome AppAlbania</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="../icons/icon48.png" alt="">
      <div>Recorder<small>Chrome AppAlbania</small></div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="openLib" data-icon="film" data-title="recordings"></button>
      <button class="icon-btn" id="openSet" data-icon="gear" data-title="settings"></button>
    </div>
  </header>

  <main id="idle">
    <div class="modes">
      <button class="big" id="recTab">
        <span class="ico" data-icon="tab"></span>
        <span class="txt"><b data-t="tabShort"></b><small data-t="tabMini"></small></span>
      </button>
      <button class="big" id="recWin">
        <span class="ico" data-icon="screen"></span>
        <span class="txt"><b data-t="windowShort"></b><small data-t="windowMini"></small></span>
      </button>
    </div>
    <div class="audio-row">
      <button class="chip" id="sndBtn" aria-pressed="true"><span data-icon="speaker"></span><span data-t="sound"></span></button>
      <label class="mic-pick"><span data-icon="mic"></span><select id="micSel" aria-label=""></select></label>
    </div>
  </main>

  <main id="active" class="hidden">
    <div class="rec-card">
      <div class="count" id="count" aria-live="polite"></div>
      <div class="rec-info">
        <span class="dot"></span>
        <span class="rec-text"><small id="statusText"></small><b class="timer" id="timer">00:00</b></span>
      </div>
      <div class="rec-btns">
        <button class="round" id="pauseBtn"></button>
        <button class="round stop" id="stopBtn"></button>
      </div>
    </div>
    <button class="btn primary small hidden" id="switchBtn"><span data-icon="tab"></span><span data-t="switchHere"></span></button>
    <div class="rec-foot">
      <span class="muted" id="recMode"></span>
      <button class="link" id="cancelBtn" data-t="cancel"></button>
    </div>
  </main>

  <p class="err hidden" id="err"></p>

  <footer>
    <button class="where" id="where" title="">
      <span data-icon="folder"></span><span id="whereText"></span>
    </button>
    <button class="btn primary small hidden" id="grant" data-t="needAccess"></button>
    <span class="kbd" id="kbd"></span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
